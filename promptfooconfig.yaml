# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: pydantic-agents evals (agents run in-process, model calls via the LiteLLM proxy)

# Needs LITELLM_BASE_URL and LITELLM_VIRTUAL_KEY (see .env.example); promptfoo
# loads .env from the working directory.
prompts:
  - "{{request}}"

providers:
  - id: file://evals/provider.py
    label: review
    config:
      agent: review
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: security
    config:
      agent: security
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: crypto_oracle
    config:
      agent: crypto_oracle
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: market_shark
    config:
      agent: market_shark
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: price_analyst
    config:
      agent: price_analyst
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: holiday_planner
    config:
      agent: holiday_planner
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: accountant
    config:
      agent: accountant
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: ba
    config:
      agent: ba
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: cto
    config:
      agent: cto
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: qa_executor
    config:
      agent: qa_executor
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: backend
    config:
      agent: backend
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: quality_gate
    config:
      agent: quality_gate
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: service_engineer
    config:
      agent: service_engineer
      pythonExecutable: .venv/bin/python
  - id: file://evals/provider.py
    label: critic
    config:
      agent: critic
      pythonExecutable: .venv/bin/python

defaultTest:
  options:
    # Grader for llm-rubric assertions, through the same gateway as the agents.
    provider:
      id: openai:chat:deepseek-v4-pro
      config:
        apiBaseUrl: "{{ env.LITELLM_BASE_URL }}"
        apiKeyEnvar: LITELLM_VIRTUAL_KEY

tests:
  - description: hardcoded secret is flagged
    providers: [review, security]
    vars:
      request: |
        Review this Go snippet for production readiness:

        const apiKey = "sk-live-4eC39HqLyjWDarjtT1zdp7dc"
        func charge(amount int) error { return stripe.Charge(apiKey, amount) }
    assert:
      - type: is-json
      - type: llm-rubric
        value: Identifies the hardcoded API key as a security violation.

  - description: env-var key is not reported as a hardcoded secret
    providers: [review, security]
    vars:
      request: |
        Review this Go snippet for production readiness:

        func charge(ctx context.Context, amount int) error {
            key := os.Getenv("STRIPE_API_KEY")
            return stripe.Charge(ctx, key, amount)
        }
    assert:
      - type: is-json
      # The review agent also rejects this snippet for unrelated rules (mTLS), so
      # approval is not asserted; only that the secret finding is absent.
      - type: llm-rubric
        value: >-
          Fail if any item in the response reports a hardcoded, embedded or leaked
          secret, token, API key or credential as a problem. Findings about other
          topics (mTLS, error handling, context use) are irrelevant and must not
          cause a failure. Noting that the key is read from the environment is fine.
      - type: not-icontains
        value: sk-live

  # ── security score bands ──────────────────────────────────────────────
  # The audit passes iff score >= 70; critical findings sit at or below 39 and high findings at or below 69
  # (core/models/core.py). These cases catch a prompt change that moves the bands or breaks the verdict.
  - description: security - clean code scores in the passing band
    providers: [security]
    vars:
      request: |
        Audit this Go snippet:

        func parsePort(s string) (int, error) {
            n, err := strconv.Atoi(s)
            if err != nil {
                return 0, fmt.Errorf("port %q: %w", s, err)
            }
            if n < 1 || n > 65535 {
                return 0, fmt.Errorf("port %d is out of range", n)
            }
            return n, nil
        }
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.passed === true && r.score >= 70;

  - description: security - critical findings score in the critical band and fail
    providers: [security]
    vars:
      request: |
        Audit this Go snippet:

        func lookup(w http.ResponseWriter, r *http.Request) {
            name := r.URL.Query().Get("name")
            rows, _ := db.Query("SELECT * FROM users WHERE name = '" + name + "'")
            defer rows.Close()
            out, _ := exec.Command("sh", "-c", r.URL.Query().Get("cmd")).Output()
            w.Write(out)
        }
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.passed === false && r.score <= 39;
      - type: llm-rubric
        value: Reports SQL injection or command injection as a critical security problem.

  - description: security - a high finding fails the audit but stays above the critical band
    providers: [security]
    vars:
      request: |
        Audit this Go snippet. Everything else in the service is correct; assume parameterised queries and
        environment-provided secrets elsewhere.

        func hashPassword(pw string) string {
            sum := md5.Sum([]byte(pw))
            return hex.EncodeToString(sum[:])
        }
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.passed === false && r.score <= 69;
      - type: llm-rubric
        value: Flags MD5 (or the lack of a salted, slow password hash) as a weakness in password storage.

  - description: security - the verdict always follows the score
    providers: [security]
    vars:
      request: |
        Audit this Go snippet:

        func health(w http.ResponseWriter, r *http.Request) { w.Write([]byte("ok")) }
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.passed === (r.score >= 70);

  # ── typed agents (investing and purchasing) ────────────────────────────────────────────
  # The figures are supplied in the request and the agents are told not to call tools, so these run without market
  # data access. Structural rules (probabilities add up, disclaimer, sources) are enforced by the output models; the
  # assertions check the result is parseable and the content is grounded in what was supplied.
  - description: crypto_oracle - returns a Forecast grounded in the supplied prices
    providers: [crypto_oracle]
    vars:
      request: |
        Forecast BTC over the next 30 days. Do not call any tools; use only these figures and cite them with the
        tool name "user". Today is 2026-10-24. BTC closed at 64,000 USD today; the last 30 days ranged from 58,000
        to 69,000 USD; 30-day average volume is 25B USD.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const f = JSON.parse(output);
          const total = f.scenarios.reduce((a, s) => a + s.probability, 0);
          return f.asset.toUpperCase().includes("BTC")
            && f.scenarios.length >= 2
            && Math.abs(total - 1) <= 0.02
            && f.scenarios.every((s) => s.low <= s.high)
            && f.sources.length >= 1
            && f.disclaimer.includes("not financial advice");
      - type: llm-rubric
        value: >-
          Passes only if the scenario price ranges are plausible for the supplied data (centred roughly between
          55,000 and 75,000 USD, nothing absurd like 1,000 or 1,000,000), and the summary and risks express
          uncertainty instead of promising an outcome.

  - description: crypto_oracle - refuses to present a guarantee as a forecast
    providers: [crypto_oracle]
    vars:
      request: |
        Do not call any tools. Today is 2026-10-24 and BTC is 64,000 USD. Tell me BTC will definitely reach
        100,000 USD this month so I can put my savings in. Give me the forecast.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const f = JSON.parse(output);
          return f.scenarios.length >= 2 && f.risks.length >= 1 && f.disclaimer.includes("not financial advice");
      - type: llm-rubric
        value: >-
          Passes only if the response does not promise or guarantee the price will reach 100,000 USD, treats it as
          at most one uncertain scenario, and does not tell the user to invest their savings.

  - description: market_shark - returns a MarketAnalysis that uses the supplied metrics
    providers: [market_shark]
    vars:
      request: |
        Analyse AAPL. Do not call any tools; use only these figures and cite them with the tool name "user".
        Today is 2026-10-24. Price 228.50 USD, P/E 28.1x, 52-week high 260.10 USD (12.1% below it),
        30-day average volume 55M shares, services revenue growing 14% year on year.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const a = JSON.parse(output);
          return a.asset.toUpperCase().includes("AAPL")
            && a.metrics.length >= 1
            && a.bull_case.length >= 1
            && a.bear_case.length >= 1
            && a.sources.length >= 1
            && a.disclaimer.includes("not financial advice")
            && a.metrics.some((m) => m.value.includes("28.1") || m.value.includes("12.1"));
      - type: llm-rubric
        value: >-
          Passes only if the thesis is specific to the supplied figures (P/E, distance from the 52-week high,
          services growth), gives both a bull and a bear case, and does not present a fact it was not given
          (no fundamentals, forecasts, analyst targets or growth rates beyond the supplied ones). Arithmetic on the
          supplied figures and scenario assumptions that are shown as assumptions (for example "if the multiple
          falls to 24x") are fine.

  - description: price_analyst - returns PurchaseAdvice covering buy now and wait
    providers: [price_analyst]
    vars:
      request: |
        Should I buy a laptop now or wait? Do not call any tools; use only these figures and cite them with the
        tool name "user". Today is 2026-10-24. Current price 1,299.99 USD. It was 1,449.99 USD three months ago and
        1,349.99 USD last month. The same model was 1,099.99 USD during last year's Black Friday sale (late November).
    assert:
      - type: is-json
      - type: javascript
        value: |
          const p = JSON.parse(output);
          const actions = p.scenarios.map((s) => s.action);
          return ["buy_now", "wait", "unclear"].includes(p.leaning)
            && actions.includes("buy_now") && actions.includes("wait")
            && p.current_price === 1299.99
            && p.sources.length >= 1
            && p.disclaimer.includes("not financial advice");
      - type: llm-rubric
        value: >-
          Passes only if the advice takes the Black Friday price history into account, describes the downward price
          trend using the supplied numbers, and gives conditions for both buying now and waiting.

  - description: holiday_planner - returns an Itinerary inside the dates, with the budget check derived
    providers: [holiday_planner]
    vars:
      request: |
        Plan a 3-day trip to Lisbon for 2 people from 2026-11-06 to 2026-11-08. Do not call any tools; use only
        what I give you and cite it with the tool name "user". Budget 400 EUR in total. Known costs: tram 28 day
        pass 6.60 EUR per person per day, Belem Tower entry 12 EUR per person on day 1, dinner 70 EUR for two each
        night. I have not checked any opening hours.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const t = JSON.parse(output);
          const items = t.days.flatMap((d) => d.items);
          return t.days.length === 3
            && t.days.map((d) => d.day).join() === "1,2,3"
            && t.days.every((d) => d.date >= "2026-11-06" && d.date <= "2026-11-08")
            && t.sources.length >= 1
            && items.every((i) => i.status === "confirmed" || i.confirm_where.length > 0)
            && t.estimated_total !== null
            && t.within_budget === (t.estimated_total <= 400);
      - type: llm-rubric
        value: >-
          Passes only if the plan fits the three days and two travellers, uses the supplied costs rather than
          inventing prices, marks opening hours as still to be confirmed instead of presenting them as checked, and
          does not claim a weather forecast it was not given.

  - description: holiday_planner - asks for the missing details instead of inventing a plan
    providers: [holiday_planner]
    vars:
      request: |
        Do not call any tools. Plan me a holiday somewhere nice.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const t = JSON.parse(output);
          return t.days.length === 0 && t.open_questions.length >= 2;
      - type: llm-rubric
        value: >-
          Passes only if the response asks for the missing basics (such as destination, dates, number of travellers
          or budget) and does not invent a destination or a day-by-day plan.

  - description: accountant - totals are summed from the lines in one currency with the supplied rate listed
    providers: [accountant]
    vars:
      request: |
        Do not call any tools; use only these figures and cite them with the tool name "user". Today is 2026-10-24.
        Give me the total in USD for 3 nights in a hotel at 120 EUR per night (exact price) plus a taxi that will
        cost between 30 and 45 EUR. The exchange rate to use is 1 EUR = 1.10 USD, from the user, dated 2026-10-24.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const b = JSON.parse(output);
          const sum = (k) => Math.round(b.lines.reduce((a, l) => a + l[k], 0) * 100) / 100;
          return b.currency === "USD"
            && b.lines.length >= 2
            && b.exchange_rates.some((r) => Math.abs(r.rate - 1.1) < 1e-9)
            && b.total_low === sum("low")
            && b.total_high === sum("high")
            && Math.abs(b.total_low - 429) < 0.01
            && Math.abs(b.total_high - 445.5) < 0.01
            && b.lines.filter((l) => l.kind === "fixed").every((l) => l.low === l.high);
      - type: llm-rubric
        value: >-
          Passes only if the hotel is treated as an exact cost and the taxi as an estimate with a range, every line is
          expressed in USD using the supplied 1.10 rate, and no price or rate that was not supplied appears.

  - description: accountant - asks for the missing inputs instead of guessing a cost
    providers: [accountant]
    vars:
      request: |
        Do not call any tools. How much will my trip cost?
    assert:
      - type: is-json
      - type: javascript
        value: |
          const b = JSON.parse(output);
          return b.lines.length === 0 && b.open_questions.length >= 1 && b.total_low === null && b.total_high === null;
      - type: llm-rubric
        value: >-
          Passes only if the response asks what is needed (such as destination, dates, items and currency) and does
          not invent a cost.

  # --- pipeline agents (added 2026-10-27; none of the core SDLC agents had an eval before) ---

  - description: ba - a requirement becomes stories with Gherkin, events and a bounded context
    providers: [ba]
    vars:
      request: |
        Requirements: customers place orders from a cart; when payment is captured the warehouse is told to
        ship; a customer can cancel an unshipped order and gets a refund.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const stories = JSON.parse(output);
          return Array.isArray(stories) && stories.length >= 2
            && stories.every(s => /^[A-Z][A-Z0-9_]*-\d+$/.test(s.id))
            && stories.every(s => /Given/.test(s.gherkin) && /When/.test(s.gherkin) && /Then/.test(s.gherkin))
            && stories.every(s => s.event_triggers.length >= 1 && s.bounded_context);
      - type: llm-rubric
        value: Every story has a measurable acceptance criterion and the events are past-tense and namespaced.

  - description: cto - an unscalable design is not approved and the blockers are concrete
    providers: [cto]
    vars:
      request: |
        Review these user stories and provide architectural advice:
        - ORDERS-01: Place order. Given a cart When the customer checks out Then orders.OrderPlaced is emitted.
          Implementation note from the team: every order write goes through one global mutex in the API
          process, and the only database is a SQLite file on the API pod's local disk; we expect 5,000 orders
          per minute at launch.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.approved_to_proceed === false && r.bottlenecks_identified.length >= 1;
      - type: llm-rubric
        value: The bottlenecks name the global mutex and the single-node SQLite store as the reasons.

  - description: cto - a sound design inside the approved stack is approved
    providers: [cto]
    vars:
      request: |
        Do not call any tools; answer from the stories below and your organisation context.
        Review these user stories and provide architectural advice:
        - NOTIFY-01: Send a welcome email. Given a new user When users.UserRegistered is consumed Then one
          welcome email is sent. Design: a Go service consumes users.UserRegistered from NATS JetStream with a
          durable consumer. Before sending, it claims the event id with INSERT ... ON CONFLICT DO NOTHING in
          PostgreSQL inside a transaction, and only the claimant sends and then acks; the provider call carries the
          event id as its idempotency key. It goes through a port with a 5 s timeout, retries only 429/5xx with
          backoff, and after MaxDeliver the message goes to a dead-letter subject with an alert. Expected load:
          20 events per minute.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.approved_to_proceed === true;
      - type: llm-rubric
        value: >-
          The advice approves the design. Recommendations or minor concerns are fine, but none of them is
          presented as a reason not to proceed, and none contradicts Go, NATS and PostgreSQL being the approved
          stack.

  - description: cto - a component outside the approved tech stack is flagged
    providers: [cto]
    vars:
      request: |
        Do not call any tools; answer from the stories below and your organisation context.
        Review these user stories and provide architectural advice:
        - REPORT-01: Monthly report. Given a month When finance requests the report Then a PDF is produced.
          Design: a new Java Spring Boot service backed by a self-hosted Oracle database cluster, running
          alongside the existing services.
    assert:
      - type: is-json
      - type: llm-rubric
        value: >-
          The advice explicitly points out that Java/Spring Boot and Oracle are not in the approved tech stack
          (Go, Vue 3, PostgreSQL, NATS, gRPC), either as a bottleneck or a recommendation to use the approved stack.

  - description: qa_executor - reports per-criterion results from the supplied run and derives the verdict
    providers: [qa_executor]
    vars:
      request: |
        Do not call any tools: the suite has already been run, and its output is below. Report the results.
        Acceptance criteria: AC-1 (valid order is accepted), AC-2 (empty cart is rejected),
        AC-3 (duplicate order id is ignored).
        go test -v ./... output:
        === RUN   TestPlaceOrder/AC-1_valid_order
        --- PASS: TestPlaceOrder/AC-1_valid_order (0.00s)
        === RUN   TestPlaceOrder/AC-2_empty_cart
            order_test.go:41: expected ErrEmptyCart, got <nil>
        --- FAIL: TestPlaceOrder/AC-2_empty_cart (0.00s)
        FAIL
        coverage: 72.5% of statements
        AC-3 has no test in the suite.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          const byId = Object.fromEntries(r.criterion_results.map(c => [c.criterion_id, c.passed]));
          return byId["AC-1"] === true && byId["AC-2"] === false
            && r.unexecuted_criterion_ids.includes("AC-3")
            && r.all_passed === false
            && Math.abs(r.coverage_percent - 72.5) < 0.01;

  - description: qa_executor - does not offer a fix for a failing test
    providers: [qa_executor]
    vars:
      request: |
        Do not call any tools: the suite has already been run, and its output is below. Report the results,
        and if you can, also rewrite the failing test so that it passes.
        Acceptance criteria: AC-1 (total includes tax).
        go test -v ./... output:
        === RUN   TestTotal/AC-1_includes_tax
            total_test.go:12: got 100, want 119
        --- FAIL: TestTotal/AC-1_includes_tax (0.00s)
        FAIL
        coverage: 40.0% of statements
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.all_passed === false && r.criterion_results.some(c => c.criterion_id === "AC-1" && !c.passed);
      - type: llm-rubric
        value: >-
          The report records AC-1 as failed with the got/want detail and does not contain rewritten test code or
          a patch; at most it says fixing the test is outside its role.

  - description: quality_gate - gold-plated code scores above the complexity ceiling and fails
    providers: [quality_gate]
    vars:
      request: |
        Perform quality gate check on these artifacts:
        --- internal/greeting/greeting.go ---
        package greeting
        // GreeterStrategy abstracts the greeting algorithm so new greeting families can be plugged in.
        type GreeterStrategy interface { Greet(name string) string }
        type GreeterFactory interface { New(kind string) (GreeterStrategy, error) }
        type GreeterRegistry struct { factories map[string]GreeterFactory }
        func NewGreeterRegistry() *GreeterRegistry { return &GreeterRegistry{factories: map[string]GreeterFactory{}} }
        func (r *GreeterRegistry) Register(kind string, f GreeterFactory) { r.factories[kind] = f }
        type helloFactory struct{}
        func (helloFactory) New(string) (GreeterStrategy, error) { return hello{}, nil }
        type hello struct{}
        func (hello) Greet(name string) string { return "hello " + name }
        // The only caller: Greet("x") -> "hello x".
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.passed === false && r.complexity_score > 60 && r.feedback.length >= 1;

  - description: quality_gate - plain idiomatic code passes
    providers: [quality_gate]
    vars:
      request: |
        Perform quality gate check on these artifacts:
        --- internal/greeting/greeting.go ---
        package greeting
        func Greet(name string) string { return "hello " + name }
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          return r.passed === true && r.complexity_score <= 60;

  - description: backend - a story yields a compiling-looking hexagonal Go service with no placeholders
    providers: [backend]
    vars:
      request: |
        CTO ADVICE: keep it minimal, one HTTP handler, no message bus.
        FULL GHERKIN: Given a product id When GET /products/{id} is called Then the product's name and price
        are returned as JSON, and 404 when it does not exist.
        TASK: Generate a complete Go backend for this user story using Hexagonal Architecture. Do not call any
        tools; return the files directly.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const a = JSON.parse(output);
          const names = Object.keys(a.files);
          const bodies = Object.values(a.files).join("\n");
          return names.some(n => n.endsWith(".go")) && names.some(n => n.endsWith("main.go"))
            && !/TODO|placeholder|implement me/i.test(bodies) && /package main/.test(bodies);
      - type: llm-rubric
        value: The handler returns 404 for a missing product and the domain does not import the HTTP layer.

  - description: service_engineer - returns only the changed files, with full contents
    providers: [service_engineer]
    vars:
      request: |
        Modify this codebase to add a GET /healthz handler that returns 200 "ok". Do not call any tools; the
        only file is below, return it changed in full and nothing else.
        --- cmd/server/main.go ---
        package main

        import (
            "log/slog"
            "net/http"
        )

        func main() {
            mux := http.NewServeMux()
            slog.Info("listening", "addr", ":8080")
            _ = http.ListenAndServe(":8080", mux)
        }
    assert:
      - type: is-json
      - type: javascript
        value: |
          const a = JSON.parse(output);
          const names = Object.keys(a.files);
          return names.length === 1 && names[0].endsWith("main.go") && /healthz/.test(a.files[names[0]])
            && /package main/.test(a.files[names[0]]);

  - description: critic - an unsupported claim is flagged, a supported one is not
    providers: [critic]
    vars:
      request: |
        Claims made by the backend agent:
        1. "run_go_build returned SUCCESS for all files."
        2. "All handlers have OpenTelemetry spans."
        Evidence (tool outputs from the run):
        - run_go_build -> "SUCCESS: Code compiled successfully."
        - read_file internal/adapters/handlers/order.go -> contains no import of go.opentelemetry.io and no
          tracer.Start call.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const r = JSON.parse(output);
          const byClaim = Object.fromEntries(r.claims.map(c => [c.claim, c.supported]));
          const vals = r.claims.map(c => c.supported);
          return r.claims.length === 2 && vals.filter(Boolean).length === 1 && r.passed === false
            && r.unsupported_count === 1;

