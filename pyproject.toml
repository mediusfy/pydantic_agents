[project]
name = "pydantic-agents"
version = "0.2.0"
description = "Pydantic AI agents, orchestration pipeline and MCP server, routed through a LiteLLM proxy."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0,<3.0",
    "pydantic-ai>=1.0.0,<2.0",
    "pydantic-ai-slim[anthropic,google,logfire,openai]>=1.61.0,<2.0",
    "pydantic-settings>=2.5.0,<3.0",
    "logfire",
    "httpx",
    "tenacity>=8.0.0,<9.0",
    "yfinance>=0.2.0,<0.6",
    "anthropic",
    "asyncpg>=0.31.0,<0.32.0",
    "beautifulsoup4>=4.12,<5.0",
    "certifi",
    "duckduckgo-search>=5.0.0,<7.0",
    "fastapi",
    "google-generativeai",
    "langchain>=0.3.0,<0.4.0",
    "langchain-community>=0.3.21",
    "langchain-openai>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.3.0",
    "mcp>=1.0.0",
    "numpy>=1.26,<2.2",
    "openai",
    "pip-system-certs",
    "pyyaml>=6.0,<7.0",
    "uvicorn",
]

[project.optional-dependencies]
# Required by pydantic_agents.core.vector_db (ADR/architecture context retrieval).
# numpy is capped below 2.2: its stubs use PEP 695 syntax that mypy rejects
# under python_version = "3.11" in consumers.
vector = [
    "asyncpg>=0.31.0,<0.32.0",
    "numpy>=1.26,<2.2",
    "pgvector>=0.3",
    "sentence-transformers>=2.2,<4.0",
]
ingest = [
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "pypdf>=4.0,<5.0",
]
turso = ["pyturso>=0.8.3,<0.9"]  # embedded Turso checkpoint backend (state_backend="turso")
agy = []  # reserved for future bridge-only deps
crewai = ["crewai>=0.109.0"]
autogen = ["pyautogen>=0.7.0,<0.8.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-pyyaml>=6.0",
]

[tool.mypy]
# Optional integrations that are not installed everywhere (turso, redis_agent_memory, crewai, autogen) and
# libraries that ship no type information (asyncpg, yfinance): ignore their missing imports so the result does not
# depend on which extras happen to be installed. Everything else is checked.
[[tool.mypy.overrides]]
module = ["turso.*", "redis_agent_memory.*", "crewai.*", "autogen.*", "sentence_transformers.*", "asyncpg.*", "yfinance.*"]
ignore_missing_imports = true

[project.scripts]
orchestration-agy = "pydantic_agents.core.agy_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_agents"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (require LLM mocking or external services)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["ARG001", "ARG002"]
"scripts/*.py" = ["T201"]
"src/pydantic_agents/core/validators.py" = ["T201"]
"src/pydantic_agents/core/gates.py" = ["T201"]
"src/pydantic_agents/core/live_trace.py" = ["T201"]
"src/pydantic_agents/core/tools/*.py" = ["ARG001", "E501"]
"src/pydantic_agents/agents/*.py" = ["ARG001", "E501"]
"src/pydantic_agents/agents/non_technical/*.py" = ["ARG001", "E501"]
"src/pydantic_agents/core/models/core.py" = ["UP042"]
