[project]
name = "pydantic-agents"
version = "0.1.0"
description = "Pydantic AI agents routed through a LiteLLM proxy, extracted from the mediusfy orchestration monorepo."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0,<3.0",
    "pydantic-ai>=1.0.0,<2.0",
    "pydantic-ai-slim[anthropic,deepseek,google,logfire,openai]>=1.61.0",
    "pydantic-settings>=2.5.0,<3.0",
    "logfire",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]

[tool.ruff]
line-length = 100
target-version = "py311"
