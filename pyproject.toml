[project]
name = "pydantic-agents"
version = "0.1.3"
description = "Pydantic AI agents routed through a LiteLLM proxy, extracted from the mediusfy orchestration monorepo."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0,<3.0",
    "pydantic-ai>=1.0.0,<2.0",
    "pydantic-ai-slim[anthropic,deepseek,google,logfire,openai]>=1.61.0",
    "pydantic-settings>=2.5.0,<3.0",
    "logfire",
    "httpx",
    "tenacity",
    "yfinance",
]

[project.optional-dependencies]
# Required by pydantic_agents.core.vector_db (ADR/architecture context retrieval).
# numpy is capped below 2.2: its stubs use PEP 695 syntax that mypy rejects
# under python_version = "3.11" in consumers.
vector = [
    "asyncpg>=0.31.0,<0.32.0",
    "numpy>=1.26,<2.2",
    "pgvector>=0.3",
    "sentence-transformers>=2.2,<4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
