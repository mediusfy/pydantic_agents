name: Changelog

# Separate from ci.yml so label changes re-run only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changelog entry
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_changelog.py "origin/${BASE_REF}"
