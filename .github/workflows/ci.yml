name: CI

on:
  pull_request:
  push:
    branches: [main]

# Python jobs install from the committed uv.lock (`--frozen` never re-resolves), so CI runs the same versions as
# `make` and a new upstream release cannot change a result. Third-party actions are pinned to a commit SHA.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --frozen --extra dev ruff check src tests scripts
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: mypy-${{ runner.os }}-
      - run: uv run --frozen --extra dev --extra vector --extra ingest mypy src
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv run --frozen --extra dev --extra vector pytest tests -q
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Base install only (no extras), so an import of an optional extra at module level fails this job.
      - run: uv run --frozen python -c "import asyncio; from pydantic_agents.mcp_server import mcp; print(len(asyncio.run(mcp.list_tools())), 'tools')"
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: make lock-check

  image-smoke:
    # Builds the real production image (linux/arm64, natively) without pushing, so a broken
    # Dockerfile/lockfile or a bloated dependency set fails the PR instead of the post-merge push.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      # Baseline ~3.6 GB (CPU-only torch + Go/Node); the CUDA torch wheel made it ~10.8 GB. Raise deliberately.
      IMAGE_SIZE_LIMIT_GB: "4.5"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: pydantic-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size gate
        run: |
          size=$(docker image inspect pydantic-agents:ci --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
          limit=$(python3 -c "print(int(float('$IMAGE_SIZE_LIMIT_GB') * 1e9))")
          if [ "$size" -gt "$limit" ]; then echo "::error::image exceeds ${IMAGE_SIZE_LIMIT_GB} GB (CUDA torch back in the lockfile?)"; exit 1; fi
      - name: Smoke test inside the image
        run: |
          docker run --rm --entrypoint python pydantic-agents:ci -c "
          import asyncio, torch, turso, sentence_transformers
          from pydantic_agents.mcp_server import mcp
          assert '+cpu' in torch.__version__, torch.__version__
          n = len(asyncio.run(mcp.list_tools()))
          assert n > 0, n
          print('torch', torch.__version__, '| tools', n)"
          docker run --rm --entrypoint sh pydantic-agents:ci -c 'go version && node --version && rg --version | head -1'
          # Runs unprivileged (numeric UID so Kubernetes can verify runAsNonRoot) and can write where agents write.
          docker run --rm --entrypoint sh pydantic-agents:ci -c 'test "$(id -u)" = 10001 && touch generated-app.probe && rm generated-app.probe && git --version'
